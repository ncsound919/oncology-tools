[project]
name = "oncoreplay"
version = "0.1.0"
description = "Version-pinned, policy-as-code replay of somatic oncology interpretation. Research use only."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
oncoreplay = "oncoreplay.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
